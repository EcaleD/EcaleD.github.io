{{- $pc := .Page.Site.Config.Privacy.YouTube -}}
{{- if not $pc.Disable -}}
{{- $ytHost := cond $pc.PrivacyEnhanced "www.youtube-nocookie.com" "www.youtube.com" -}}
<div class="compact-article-media">
    <div class="video-wrapper">
        <iframe
            loading="lazy"
            src="https://{{ $ytHost }}/embed/{{ .Get "id" }}"
            allowfullscreen
            title="YouTube Video"
        >
        </iframe>
    </div>
</div>
{{- end -}}
