<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1230" viewBox="0 0 1560 1230" role="img" aria-labelledby="title description">
  <title id="title">A documentation RAG app — component architecture</title>
  <desc id="description">A Next.js chat UI communicates with a FastAPI service. The service contains hybrid retrieval and answer components and depends on PostgreSQL with pgvector, local embedding and reranking models, and a hosted language model. An offline index builder uses the embedding model and stages new index generations in PostgreSQL. Solid arrows show application dependencies; dashed arrows show index-maintenance dependencies. Source acquisition is outside the diagram.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#456159"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #17211D; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: -.7px; }
      .subtitle { font-size: 21px; fill: #56625C; }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: 1.7px; fill: #56625C; }
      .heading { font-size: 25px; font-weight: 650; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #56625C; }
      .edge { fill: none; stroke: #456159; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
      .maintenance { stroke-dasharray: 7 6; }
      .panel { fill: #FFFDF8; stroke: #D4D3C9; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1560" height="1230" fill="#F5F1E8"/>
  <text x="50" y="65" class="title">A documentation RAG app</text>
  <text x="50" y="104" class="subtitle">Application components, shared services, and index maintenance</text>

  <!-- Browser -->
  <rect x="50" y="165" width="325" height="350" rx="22" fill="#E5EEF4" stroke="#B8CAD5" stroke-width="1.5"/>
  <text x="76" y="202" class="kicker">INTERACTION</text>
  <text x="76" y="248" class="heading">Next.js chat UI</text>
  <text x="76" y="291" class="body">Conversation view</text>
  <text x="76" y="327" class="body">Streaming answer</text>
  <text x="76" y="363" class="body">Rendered Markdown</text>
  <text x="76" y="399" class="body">Source inspection</text>
  <text x="76" y="456" class="small">Provisional text is replaced</text>
  <text x="76" y="481" class="small">by the completed answer.</text>

  <!-- API boundary -->
  <rect x="440" y="165" width="730" height="680" rx="24" class="panel"/>
  <text x="470" y="202" class="kicker">APPLICATION SERVICE</text>
  <text x="470" y="242" class="heading">FastAPI · request orchestration</text>
  <text x="470" y="274" class="small">Session history · retrieval calls · answer lifecycle</text>

  <rect x="470" y="305" width="670" height="215" rx="17" fill="#E4EEE9" stroke="#AFC7BB" stroke-width="1.5"/>
  <text x="496" y="347" class="heading">Hybrid retrieval</text>
  <text x="496" y="387" class="body">Identifier + title + full-text + dense search</text>
  <text x="496" y="425" class="body">Weighted rank fusion · bounded reranking</text>
  <text x="496" y="463" class="body">Intent rules · document diversity · neighbors</text>
  <text x="496" y="497" class="small">Uses stored content and local retrieval models</text>

  <rect x="470" y="585" width="670" height="220" rx="17" fill="#F7E1D7" stroke="#E6B6A4" stroke-width="1.5"/>
  <text x="496" y="627" class="heading">Answer handling</text>
  <text x="496" y="667" class="body">Question + bounded history + current evidence</text>
  <text x="496" y="705" class="body">Generation adapter · streamed text buffer</text>
  <text x="496" y="743" class="body">Citation-ID checks · completed answer</text>
  <text x="496" y="781" class="small">Citation format checks do not verify factual support.</text>

  <!-- Remote generation -->
  <rect x="1240" y="585" width="270" height="220" rx="22" fill="#F7E1D7" stroke="#E6B6A4" stroke-width="1.5"/>
  <text x="1266" y="623" class="kicker">REMOTE SERVICE</text>
  <text x="1266" y="666" class="heading">Hosted LLM</text>
  <text x="1266" y="705" class="body">Generation API</text>
  <text x="1266" y="747" class="small">Receives selected text</text>
  <text x="1266" y="773" class="small">and conversation context</text>

  <!-- Shared dependencies -->
  <rect x="440" y="925" width="340" height="160" rx="22" fill="#E5EEF4" stroke="#B8CAD5" stroke-width="1.5"/>
  <text x="466" y="962" class="kicker">PERSISTENCE</text>
  <text x="466" y="1001" class="heading">PostgreSQL + pgvector</text>
  <text x="466" y="1037" class="small">Content · chunks · vectors</text>
  <text x="466" y="1063" class="small">Generations · sessions · feedback</text>

  <rect x="820" y="925" width="350" height="160" rx="22" fill="#E4EEE9" stroke="#AFC7BB" stroke-width="1.5"/>
  <text x="846" y="962" class="kicker">LOCAL INFERENCE</text>
  <text x="846" y="1001" class="heading">Retrieval models</text>
  <text x="846" y="1037" class="small">BGE-M3 · dense embeddings</text>
  <text x="846" y="1063" class="small">bge-reranker-v2-m3 · pair scores</text>

  <!-- Index maintenance starts with prepared content, not acquisition -->
  <rect x="50" y="650" width="325" height="435" rx="22" fill="#F5ECCF" stroke="#D9C99A" stroke-width="1.5"/>
  <text x="76" y="687" class="kicker">INDEX MAINTENANCE</text>
  <text x="76" y="733" class="heading">Index builder</text>
  <text x="76" y="778" class="body">Prepared content</text>
  <text x="76" y="814" class="body">Structural parsing</text>
  <text x="76" y="850" class="body">Context-aware chunks</text>
  <text x="76" y="886" class="body">Embedding cache reuse</text>
  <text x="76" y="922" class="body">New generation + checks</text>
  <text x="76" y="978" class="small">Activate only after validation.</text>
  <text x="76" y="1004" class="small">Keep the old generation</text>
  <text x="76" y="1030" class="small">available if a build fails.</text>

  <!-- Connectors indicate dependencies or data exchange, not a timeline. -->
  <path d="M375 332 H440" class="edge" marker-start="url(#arrow)"/>
  <text x="407" y="305" class="small" text-anchor="middle">HTTP</text>
  <text x="407" y="365" class="small" text-anchor="middle">SSE</text>

  <path d="M805 520 V585" class="edge"/>
  <text x="826" y="558" class="small">selected evidence</text>

  <path d="M1170 695 H1240" class="edge"/>

  <path d="M600 845 V925" class="edge"/>
  <text x="620" y="890" class="small">read / write</text>
  <path d="M995 845 V925" class="edge"/>
  <text x="1015" y="890" class="small">inference</text>

  <path d="M375 1000 H440" class="edge maintenance"/>
  <path d="M212 1085 V1140 H995 V1085" class="edge maintenance"/>
  <rect x="464" y="1124" width="220" height="30" fill="#F5F1E8"/>
  <text x="574" y="1146" class="small" text-anchor="middle">embedding calls</text>

  <path d="M50 1194 H93" class="edge"/>
  <text x="110" y="1200" class="small">Application dependency / data exchange</text>
  <path d="M645 1194 H688" class="edge maintenance"/>
  <text x="705" y="1200" class="small">Index-maintenance dependency</text>
</svg>
